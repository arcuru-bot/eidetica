[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Development automation tasks for Eidetica"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1.0"
indicatif = "0.17"
tokio = { version = "1.0", features = ["process", "rt-multi-thread", "io-util", "time", "macros", "fs"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
crossterm = "0.27"