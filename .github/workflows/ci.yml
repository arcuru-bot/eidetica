name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (x86_64-linux)
    runs-on: ubicloud-standard-8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # On PRs: build the checks only — fast feedback, integration is push-only.
      - name: Checks
        if: github.event_name == 'pull_request'
        run: |
          nix-fast-build --skip-cached --no-nom --no-link

      # On push/dispatch: build checks + integration in ONE nix-fast-build
      # invocation. nix-fast-build only takes a single target, so we point it at
      # the `.#legacyPackages.x86_64-linux.ci` aggregate (checks + integration).
      # A single dependency graph shares testCheckArtifacts (built once) and lets
      # the integration VM's serial boot/run overlap the check compiles, instead
      # of the two running back-to-back as separate steps.
      - name: Checks + integration
        if: github.event_name != 'pull_request'
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#legacyPackages.x86_64-linux.ci'

  ci-arm:
    name: CI (aarch64-linux)
    if: github.event_name != 'pull_request'
    runs-on: ubicloud-standard-16-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Checks
        run: |
          nix-fast-build --skip-cached --no-nom --no-link

  # Impure half of ifttt-lint: did both ends of a guarded IfChange/ThenChange
  # block co-change in this PR? Can't be a Nix flake check — it needs two real
  # git revs, so it lives here rather than in the `lint` check set (the pure
  # structural half rides nix-fast-build above). Read-only, no secrets, so no
  # fork-fence is needed. Escape hatch: put `NO_IFTTT=<reason>` in a commit
  # message to suppress the diff check for a deliberately-unpaired change (the
  # structural check still runs regardless).
  ifttt-diff:
    name: ifttt-lint (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need both PR base and head reachable for the diff range.
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Validate guarded blocks co-changed
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.sha }}
        run: |
          # --patch demo (verification commit for ifttt-lint's stdin mode): a
          # trivial impure `git diff` supplies the changed ranges; ifttt-lint
          # consults no VCS, so validation itself is hermetic and cacheable.
          # Interim form before --patch landed: nix run .#ifttt-lint -- --diff "$RANGE"
          git diff "$RANGE" | nix run .#ifttt-lint -- --patch -
